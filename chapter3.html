<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="webpics/icon.png">
  <title>Chapter 3 — Scaling + Structural Test</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fonts.css">
  <script src="js/lenis.min.js"></script>
</head>
<body class="chapter-page">

  <div class="chapter-content">

    <aside class="chapter-sidebar">
      <div class="sidebar-top-group">
        <div class="sidebar-top">
          <a href="index.html#phase1" class="sidebar-logo">SOFT ERROR</a>
          <span class="sidebar-chap">Chapter 3</span>
        </div>
        <h1 class="chapter-title">Scaling +<br>Structural Test</h1>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" data-view="stacked">STACKED VIEW</button>
        <button class="view-btn" data-view="traditional">TRADITIONAL VIEW</button>
        <button class="view-btn scroll-top-btn" id="scrollTopBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M3 11 L8 5 L13 11"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="chapter2.html" class="nav-arrow">
          <svg width="48" height="24" viewBox="0 0 32 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 1 L1 8 L8 15"/></svg>
        </a>
        <a href="library.html" class="nav-library">Library</a>
        <a href="chapter4.html" class="nav-arrow">
          <svg width="48" height="24" viewBox="0 0 32 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M24 1 L31 8 L24 15"/></svg>
        </a>
      </nav>
    </aside>

    <div class="chapter-main">
      <div class="card-reference" id="cardReference" style="display:none;">
        <span class="ref-label">text</span>
        <p class="ref-text">text</p>
      </div>
      <div class="image-stack" id="imageStack">
        <img src="webpics/C3d1.jpg" alt="Structural test 1" class="stack-card" data-index="0" data-section="C3d1">
        <img src="webpics/C3d2.jpg" alt="Structural test 2" class="stack-card" data-index="1" data-section="C3d2">
        <img src="webpics/C3d3.jpg" alt="Structural test 3" class="stack-card" data-index="2" data-section="C3d3">
        <img src="webpics/C3d4.jpg" alt="Structural test 4" class="stack-card" data-index="3" data-section="C3d4">
      </div>
    </div><!-- .chapter-main -->

  </div><!-- .chapter-content -->

  <div class="detail-section" id="detailSection" style="display:none;">
    <div class="detail-grid" id="detailGrid"></div>
  </div>

  <script>
    // Lenis smooth scroll
    const lenis = new Lenis({ duration: 1.2, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    // Offset content below the fixed mobile header (cleared on desktop)
    (function () {
      var sb = document.querySelector('.chapter-sidebar');
      var main = document.querySelector('.chapter-main');
      var mq = window.matchMedia('(max-width: 768px)');
      function fitHeader() {
        if (!sb || !main) return;
        main.style.paddingTop = mq.matches ? (sb.offsetHeight + 20) + 'px' : '';
      }
      fitHeader();
      window.addEventListener('resize', fitHeader);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeader);
    })();

    // --- Scroll to Top ---
    document.getElementById('scrollTopBtn').addEventListener('click', function() {
      lenis.scrollTo(0);
    });

    // --- View Toggle (with FLIP animation) ---
    (function() {
      const toggle = document.getElementById('viewToggle');
      const buttons = toggle.querySelectorAll('.view-btn:not(.scroll-top-btn)');
      const stack = document.getElementById('imageStack');
      const cards = stack.querySelectorAll('.stack-card');

      buttons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          // --- FLIP: First — record current positions ---
          var first = [];
          cards.forEach(function(card) {
            var rect = card.getBoundingClientRect();
            first.push(rect);
          });

          // Disable CSS transitions during FLIP to prevent conflicts
          cards.forEach(function(c) { c.style.transition = 'none'; });

          // Update active button
          buttons.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');

          // Switch view class (LAST — layout engine switches here)
          var view = btn.getAttribute('data-view');
          var main = document.querySelector('.chapter-main');
          if (view === 'traditional') {
            stack.classList.add('traditional');
            main.classList.add('view-traditional');
          } else {
            stack.classList.remove('traditional');
            main.classList.remove('view-traditional');
          }

          // --- FLIP: Invert + Play — animate delta to zero ---
          cards.forEach(function(card, i) {
            var last = card.getBoundingClientRect();
            var dx = first[i].left - last.left;
            var dy = first[i].top - last.top;

            // Re-enable CSS transitions
            card.style.transition = '';

            if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
              card.animate([
                { transform: 'translate(' + dx + 'px, ' + dy + 'px)' },
                { transform: 'translate(0, 0)' }
              ], {
                duration: 800,
                easing: 'cubic-bezier(0.23, 1, 0.32, 1)',
                composite: 'add'
              });
            }
          });
        });
      });
    })();

    // --- Image Stack Interaction ---
    (function() {
      const stack = document.getElementById('imageStack');
      const cards = stack.querySelectorAll('.stack-card');
      const refBox = document.getElementById('cardReference');
      const detailSection = document.getElementById('detailSection');
      const detailGrid = document.getElementById('detailGrid');
      let activeIndex = -1;

      // Section → title + description (placeholder until copy.txt Chapter 3 is filled).
      const SECTION_TEXT = {
        'C3d1': { title: 'Mid-Scale Prototype', text: 'First Structural Column Where Soft Error Materializes' },
        'C3d2': { title: 'Augmented Reality-Guided Fabrication', text: 'Projecting Digital Extrusion Points into the Physical Realm' },
        'C3d3': { title: 'Mid-Scale Prototype Printing', text: 'Collaborative Extrusion, Excavation and Cleaning of the Cement Column' },
        'C3d4': { title: 'Post-Production Analysis', text: 'Mapping Structural Failure Between Predicted and Printed Form' }
      };
      // Section → detail image blocks (each image has a src + layout template).
      const DETAILS = {
        'C3d1': [
          { src: 'webpics/det/C3/C3d1-1.jpg', layout: 'center-small', text: `This chapter documents the production of a mid-scale cement prototype using the second iteration of the volumized point and connection methodology. Building on earlier digital-to-physical translations, the prototype introduces scale, structural capacity, and a new relationship between human, material, and digital instruction. Human fabrication, mediated through augmented reality, becomes an intermediary step toward eventual robotic production, testing how computational information can guide physical construction without predetermining its final form. The research asks how this human-led process might translate develop greater structural capacity while maintaining material indeterminacy as a generative condition.
Volumization of point Digital extrusion coordinates of Digital reference field physical object and physical grid size coordinates The prototype begins with a linear grid that establishes a shared digital and physical framework within which points can be positioned to define the object. Each selected point is first given a simplified digital volume, then replaced with a material profile derived from previous cement-printing experiments. These accumulated material behaviors allow us to predict the object's texture and overall form before soft error produced as digital information becomes physical matter.` },
          { src: 'webpics/det/C3/C3d1-2.jpg', layout: 'center-small', text: `An initial symmetrical model was generated in Houdini, distributing approximately 150 extrusion points within a controlled spatial system. The model was subsequently volumised to approximate its anticipated physical outcome. A pre-production structural analysis was then conducted layer by layer, with the distribution of extrusion points adjusted to increase the likelihood of self-support. This involved reducing extrusion density toward the upper layers and maintaining sufficient adjacency between points to establish local support conditions. The resulting form establishes a correspondence between computational logic and material performance, positioning the model as a mediating framework between digital control and human manipulation.
The pre-production process then examined the model layer by layer to assess connectivity, structural automate this analysis through more complex computational and structural simulation, this initial study relied on the manual examination of each cross-section. Areas of insufficient overlap or unstable material interaction were identified and the point distribution adjusted accordingly. Through this iterative process, structural weaknesses could be addressed while maintaining the overall spatial logic and design intent of the model.` },
          { src: 'webpics/det/C3/C3d1-3.jpg', layout: 'right-large', text: "Here is Soft Error, from projected to materialized. This large scale model marks the first full-scale realization of the project's construction methodology. The digital projection establishes a framework of extrusion events, while the material physical result retains the overall organizational logic of the projected model, it departs from its precise geometry as individual extrusions expand, merge, and deform during fabrication. Rather than treating this divergence as error, the project positions it as a productive condition in which architectural form is co-authored exists between prediction and emergence, where indeterminacy precision." },
          { src: 'webpics/det/C3/C3d1-4.jpg', layout: 'center-small', noText: true }
        ],
        'C3d2': [
          { src: 'webpics/det/C3/C3d2-1.jpg', layout: 'right-large', text: "To enable large-scale extrusion within an enclosed substrate environment, the fabrication process was augmented through the interfacing with Grasshopper via Fologram. This system generated precise visual coordinates for extrusion, compensating for the limited visibility imposed by the bounding box and substrate conditions. By projecting target points directly into the user's field of view, execution. This approach establishes a foundation for more responsive and complex feedback systems within hybrid digital-physical fabrication workflows." },
          { src: 'webpics/det/C3/C3d2-2.jpg', layout: 'right-small', text: `Process:
1. Model translation into a Grasshopper workflow
2. Upload to HoloLens via Fologram
3. Generation of spatial extrusion coordinates
4. AR-guided nozzle alignment with target points
5. Layer-by-layer extrusion within an enclosed substrate volume` },
          { src: 'webpics/det/C3/C3d2-3.jpg', layout: 'center-small', noText: true }
        ],
        'C3d3': [
          { src: 'webpics/det/C3/C3d3-1.jpg', layout: 'right-large', text: `A cement mixture (6:4 cement to water) was prepared to achieve an appropriate extrusion consistency and loaded into a syringe. The nozzle was calibrated using physical markers to control insertion depth within the substrate bed. Extrusion points were determined through cross-referencing with digital layer instructions, using labelled coordinates to guide precise deposition. Each extrusion was recorded as either “line' or 'dot', alongside the volume of material deposited. This process was repeated across successive layers, with continuous verification to ensure connectivity between neighboring extrusions, enabling the development of a cohesive, self-supporting structure.
Process: 1,2, 3: Preparation 1.Cement mixing 2.Syringe filling 3. 4,5: Extrusion 4.Check the extrusion point 5.Holding and extrusion` },
          { src: 'webpics/det/C3/C3d3-2.jpg', layout: 'right-large', text: `A cement mixture (6:4 cement to water) was prepared to achieve an appropriate extrusion consistency and loaded into a syringe. The nozzle was calibrated using physical markers to control insertion depth within the substrate bed. Extrusion points were determined through cross-referencing with digital layer instructions, using labelled coordinates to guide precise deposition. Each extrusion was recorded as either ‘line' or'dot', alongside the volume of material deposited. This process was repeated across successive layers, with cohesive, self-supporting structure.
Process: Unwrapping 1.Clean the first layer to check the model 2.Remove perlite in the box 3.Clean perlite on surface 4.Flush away perlite not stuck to cement 5.Air-drying the model` }
        ],
        'C3d4': [
          { src: 'webpics/det/C3/C3d4-1.jpg', layout: 'right-large', text: "The completed structure was evaluated to assess how the intended extrusion strategy translated into physical fabrication. Both point and line extrusions demonstrated a degree of control within the printing methodology, producing a largely stable and continuous structure." },
          { src: 'webpics/det/C3/C3d4-2.jpg', layout: 'right-large', text: "This proposal explores the expansion of non-predictive extrusion methodologies toward spatial-scale production. Through multidirectional printing, form is partially controlled at the level of coordinate distribution and extrusion logic, while the final interaction. The resulting structures operate between digital intention and physical negotiation, suggesting a model for architectural growth that is guided rather than fully predetermined." }
        ]
      };

      function hideDetail() {
        detailSection.style.display = 'none';
        detailGrid.innerHTML = '';
        detailGrid.style.display = '';
      }

      function showDetail(section) {
        var blocks = DETAILS[section];
        if (!blocks || blocks.length === 0) {
          hideDetail();
          return;
        }
        detailGrid.style.display = '';
        detailGrid.innerHTML = '';
        blocks.forEach(function(block) {
          var wrap = document.createElement('div');
          wrap.className = 'detail-block layout-' + block.layout;

          if (!block.noText) {
            var txt = document.createElement('div');
            txt.className = 'detail-text';
            var body = document.createElement('p');
            body.className = 'ref-text';
            body.textContent = block.text || 'place holder place holder place holder place holder place holder place holder place holder place holder place holder place holder';
            txt.appendChild(body);
            wrap.appendChild(txt);
          }

          var img = document.createElement('img');
          img.className = 'detail-img';
          img.src = block.src;
          img.alt = section + ' detail';
          img.loading = 'lazy';

          wrap.appendChild(img);
          detailGrid.appendChild(wrap);
        });
        detailSection.style.display = 'block';
      }

      function deselect() {
        activeIndex = -1;
        stack.classList.remove('selected');
        cards.forEach(function(c) { c.classList.remove('active'); });
        refBox.style.display = 'none';
        hideDetail();
      }

      cards.forEach(function(card) {
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          e.preventDefault();
          var idx = parseInt(card.getAttribute('data-index'));

          if (activeIndex === idx) {
            deselect();
          } else {
            activeIndex = idx;
            stack.classList.add('selected');
            cards.forEach(function(c) { c.classList.remove('active'); });
            card.classList.add('active');
            // Show reference text per card
            var section = card.getAttribute('data-section');
            var ref = SECTION_TEXT[section];
            refBox.querySelector('.ref-label').textContent = ref.title;
            refBox.querySelector('.ref-text').textContent = ref.text;
            refBox.style.display = 'block';
            // Show detail images for the selected section
            showDetail(section);
          }
        });
      });

      // Click on empty area inside the stack → deselect
      stack.addEventListener('click', function(e) {
        deselect();
      });

      // Click outside the stack → deselect
      document.addEventListener('click', function(e) {
        if (!stack.contains(e.target)) {
          deselect();
        }
      });

      // Deep-link from Library: preselect the image named by #image=N
      if (location.hash.indexOf('#image=') === 0) {
        var idx = parseInt(location.hash.slice(7), 10);
        var target = stack.querySelector('.stack-card[data-index="' + idx + '"]');
        if (target) target.click();
      }
    })();
  </script>

  <script src="js/zoom.js"></script>
</body>
</html>
