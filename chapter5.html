<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="webpics/icon.png">
  <title>Chapter 5 — Large-Scale Prototype Production</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fonts.css">
  <script src="js/lenis.min.js"></script>
</head>
<body class="chapter-page">

  <div class="chapter-content">

    <aside class="chapter-sidebar">
      <div class="sidebar-top-group">
        <div class="sidebar-top">
          <a href="index.html#phase1" class="sidebar-logo">SOFT ERROR</a>
          <span class="sidebar-chap">Chapter 5</span>
        </div>
        <h1 class="chapter-title">Large-Scale<br>Prototype<br>Production</h1>
      </div>
      <div class="view-toggle" id="viewToggle">
        <button class="view-btn active" data-view="stacked">STACKED VIEW</button>
        <button class="view-btn" data-view="traditional">TRADITIONAL VIEW</button>
        <button class="view-btn scroll-top-btn" id="scrollTopBtn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M3 11 L8 5 L13 11"/></svg>
        </button>
      </div>
      <nav class="sidebar-nav">
        <a href="chapter4.html" class="nav-arrow">
          <svg width="48" height="24" viewBox="0 0 32 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M8 1 L1 8 L8 15"/></svg>
        </a>
        <a href="library.html" class="nav-library">Library</a>
        <a href="chapter6.html" class="nav-arrow">
          <svg width="48" height="24" viewBox="0 0 32 16" fill="none" stroke="currentColor" stroke-width="1"><path d="M24 1 L31 8 L24 15"/></svg>
        </a>
      </nav>
    </aside>

    <div class="chapter-main">
      <div class="card-reference" id="cardReference" style="display:none;">
        <span class="ref-label">text</span>
        <p class="ref-text">text</p>
      </div>
      <div class="image-stack" id="imageStack">
        <img src="webpics/C5d1.jpg" alt="Large-scale prototype 1" class="stack-card" data-index="0" data-section="C5d1">
        <img src="webpics/C5d2.jpg" alt="Large-scale prototype 2" class="stack-card" data-index="1" data-section="C5d2">
        <img src="webpics/C5d3.jpg" alt="Large-scale prototype 3" class="stack-card" data-index="2" data-section="C5d3">
        <img src="webpics/C5d4.jpg" alt="Large-scale prototype 4" class="stack-card" data-index="3" data-section="C5d4">
        <img src="webpics/C5d5.jpg" alt="Large-scale prototype 5" class="stack-card" data-index="4" data-section="C5d5">
      </div>
    </div><!-- .chapter-main -->

  </div><!-- .chapter-content -->

  <div class="detail-section" id="detailSection" style="display:none;">
    <div class="detail-grid" id="detailGrid"></div>
  </div>

  <script>
    // Lenis smooth scroll
    const lenis = new Lenis({ duration: 1.2, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true });
    function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
    requestAnimationFrame(raf);

    // Offset content below the fixed mobile header (cleared on desktop)
    (function () {
      var sb = document.querySelector('.chapter-sidebar');
      var main = document.querySelector('.chapter-main');
      var mq = window.matchMedia('(max-width: 768px)');
      function fitHeader() {
        if (!sb || !main) return;
        main.style.paddingTop = mq.matches ? (sb.offsetHeight + 20) + 'px' : '';
      }
      fitHeader();
      window.addEventListener('resize', fitHeader);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHeader);
    })();

    // --- Scroll to Top ---
    document.getElementById('scrollTopBtn').addEventListener('click', function() {
      lenis.scrollTo(0);
    });

    // --- View Toggle (with FLIP animation) ---
    (function() {
      const toggle = document.getElementById('viewToggle');
      const buttons = toggle.querySelectorAll('.view-btn:not(.scroll-top-btn)');
      const stack = document.getElementById('imageStack');
      const cards = stack.querySelectorAll('.stack-card');

      buttons.forEach(function(btn) {
        btn.addEventListener('click', function() {
          // --- FLIP: First — record current positions ---
          var first = [];
          cards.forEach(function(card) {
            var rect = card.getBoundingClientRect();
            first.push(rect);
          });

          // Disable CSS transitions during FLIP to prevent conflicts
          cards.forEach(function(c) { c.style.transition = 'none'; });

          // Update active button
          buttons.forEach(function(b) { b.classList.remove('active'); });
          btn.classList.add('active');

          // Switch view class (LAST — layout engine switches here)
          var view = btn.getAttribute('data-view');
          var main = document.querySelector('.chapter-main');
          if (view === 'traditional') {
            stack.classList.add('traditional');
            main.classList.add('view-traditional');
          } else {
            stack.classList.remove('traditional');
            main.classList.remove('view-traditional');
          }

          // --- FLIP: Invert + Play — animate delta to zero ---
          cards.forEach(function(card, i) {
            var last = card.getBoundingClientRect();
            var dx = first[i].left - last.left;
            var dy = first[i].top - last.top;

            // Re-enable CSS transitions
            card.style.transition = '';

            if (Math.abs(dx) > 0.5 || Math.abs(dy) > 0.5) {
              card.animate([
                { transform: 'translate(' + dx + 'px, ' + dy + 'px)' },
                { transform: 'translate(0, 0)' }
              ], {
                duration: 800,
                easing: 'cubic-bezier(0.23, 1, 0.32, 1)',
                composite: 'add'
              });
            }
          });
        });
      });
    })();

    // --- Image Stack Interaction ---
    (function() {
      const stack = document.getElementById('imageStack');
      const cards = stack.querySelectorAll('.stack-card');
      const refBox = document.getElementById('cardReference');
      const detailSection = document.getElementById('detailSection');
      const detailGrid = document.getElementById('detailGrid');
      let activeIndex = -1;

      // Section → title + description (placeholder until copy.txt Chapter 5 is filled).
      const SECTION_TEXT = {
        'C5d1': { title: 'Design Development', text: 'From Hand Sketch to Mesh Model, Houdini and Extrusion Points' },
        'C5d2': { title: 'Pattern Development', text: 'Intersecting Volume Systems Tested Through Complex Point Patterns' },
        'C5d3': { title: 'F.U.N.C. Production', text: 'Full-Scale Prototype Revealed' },
        'C5d4': { title: 'Material Signatures', text: '3D Extrusion Methodology Fabrication Language' },
        'C5d5': { title: 'Form and Function', text: 'Human Interaction Negotiated with Emergent Material Form' }
      };
      // Section → detail image blocks (each image has a src + layout template).
      const DETAILS = {
        'C5d1': [
          { src: 'webpics/det/C5/C5d1-1.jpg', layout: 'right-large', text: "Initial conceptual studies and freehand ideations for the subsequent prototype were formalized and rationalized. The intention was to design form before predetermining function, designing an achievable prototype capable of transitioning the researching into the next phase. Human imagination and intent ground the object and initiate the human, digital, and material co-authorship of the multidirectional methodology." },
          { src: 'webpics/det/C5/C5d1-2.jpg', layout: 'right-large', text: "Using the digital simulation platform, alternative binder substrate pairings were iteratively tested to reconcile structural integrity with aesthetic intent." }
        ],
        'C5d2': [
          { src: 'webpics/det/C5/C5d2-1.jpg', layout: 'right-large', text: "Using a consistent set of extrusion points, our computational algorithm generated multiple connection strategies by varying how neighboring points were linked. Rather than altering the quantity or position of deposition events, each iteration reorganized their relationships, producing distinct structural patterns and spatial behaviors from the same underlying dataset." },
          { src: 'webpics/det/C5/C5d2-2.jpg', layout: 'right-large', text: "Using an identical point and extrusion pattern, these studies isolate the influence of substrate material on the final printed form. While the computational logic and produce distinct spatial, structural, and surface conditions as individual extrusions interact with their surrounding material. The substrate becomes an connectivity, and geometric resolution. The resulting forms demonstrate that architectural outcomes emerge through negotiation." },
          { src: 'webpics/det/C5/C5d2-3.jpg', layout: 'right-large', text: "The final point-based toolpath was evaluated through layer-by-layer simulation to guide the manual extrusion workflow and support structural continuity. By verifying inter-point connectivity and overlap across each layer prior to physical fabrication, the simulation provided an actionable framework for human execution while reducing the risk of localized bond failure." }
        ],
        'C5d3': [
          { src: 'webpics/det/C5/C5d3-1.jpg', layout: 'center-small', noText: true },
          { src: 'webpics/det/C5/C5d3-2.jpg', layout: 'right-small', text: "The material composition does not conform to the boundaries of the designed object. Perlite and shredded tire interact, overlap, and become bound beneath the surface, producing material territories independent of the printed geometry. Unlike conventional assemblies where materials remain discrete, here their interaction becomes part of the object itself. Extrusion spikes protrude from the surface as traces of fabrication, a mechanical ghost of the extrusion process and the beginnings of a visual language specific to the methodology." },
          { src: 'webpics/det/C5/C5d3-3.jpg', layout: 'right-large', text: "F.U.N.C. Production Once printing and curing were complete, the mould was opened and the unbound substrate progressively excavated, revealing the consolidated form embedded within." },
          { src: 'webpics/det/C5/C5d3-4.jpg', layout: 'right-large', noText: true },
          { src: 'webpics/det/C5/C5d3-5.jpg', layout: 'center-small', noText: true },
          { src: 'webpics/det/C5/C5d3-6.jpg', layout: 'center-small', noText: true },
          { src: 'webpics/det/C5/C5d3-7.jpg', layout: 'right-large', text: "Applying the completed FUNC geometry across multiple material systems demonstrates how a consistent computational framework produces distinct architectural outcomes. While the point distribution, connection logic, and extrusion sequence remain unchanged, each material translates the same construction methodology differently through its unique behavior and interaction with the surrounding substrate. Rather than reproducing identical objects, the methodology generates a family of related forms that preserve their organizational logic while adapting to material conditions. These studies position material selection not as a post-design decision, but as an active contributor to spatial, structural, and formal expression." }
        ],
        'C5d4': [
          { src: 'webpics/det/C5/C5d4-1.jpg', layout: 'center-large', noText: true },
          { src: 'webpics/det/C5/C5d4-2.jpg', layout: 'center-large', noText: true },
          { src: 'webpics/det/C5/C5d4-3.jpg', layout: 'center-large', noText: true },
          { src: 'webpics/det/C5/C5d4-4.jpg', layout: 'center-large', noText: true }
        ],
        'C5d5': [
          { src: 'webpics/det/C5/C5d5-1.jpg', layout: 'right-large', text: "Soft Error questions the relationship between form and function. If architecture emerge rather than be assigned? Instead of designing spaces around fixed programmes, the methodology proposes that material formation and spatial organization precede or co-develop with functional definition. Human interaction opportunities and constraints produced by the built form. Rather than prescribing how architecture should be used, Soft Error suggests a framework in which alongside material and computational processes." }
        ]
      };

      function hideDetail() {
        detailSection.style.display = 'none';
        detailGrid.innerHTML = '';
        detailGrid.style.display = '';
      }

      function showDetail(section) {
        var blocks = DETAILS[section];
        if (!blocks || blocks.length === 0) {
          hideDetail();
          return;
        }
        detailGrid.style.display = '';
        detailGrid.innerHTML = '';
        blocks.forEach(function(block) {
          var wrap = document.createElement('div');
          wrap.className = 'detail-block layout-' + block.layout;

          if (!block.noText) {
            var txt = document.createElement('div');
            txt.className = 'detail-text';
            var body = document.createElement('p');
            body.className = 'ref-text';
            body.textContent = block.text || 'place holder place holder place holder place holder place holder place holder place holder place holder place holder place holder';
            txt.appendChild(body);
            wrap.appendChild(txt);
          }

          var img = document.createElement('img');
          img.className = 'detail-img';
          img.src = block.src;
          img.alt = section + ' detail';
          img.loading = 'lazy';

          wrap.appendChild(img);
          detailGrid.appendChild(wrap);
        });
        detailSection.style.display = 'block';
      }

      function deselect() {
        activeIndex = -1;
        stack.classList.remove('selected');
        cards.forEach(function(c) { c.classList.remove('active'); });
        refBox.style.display = 'none';
        hideDetail();
      }

      cards.forEach(function(card) {
        card.addEventListener('click', function(e) {
          e.stopPropagation();
          e.preventDefault();
          var idx = parseInt(card.getAttribute('data-index'));

          if (activeIndex === idx) {
            deselect();
          } else {
            activeIndex = idx;
            stack.classList.add('selected');
            cards.forEach(function(c) { c.classList.remove('active'); });
            card.classList.add('active');
            // Show reference text per card
            var section = card.getAttribute('data-section');
            var ref = SECTION_TEXT[section];
            refBox.querySelector('.ref-label').textContent = ref.title;
            refBox.querySelector('.ref-text').textContent = ref.text;
            refBox.style.display = 'block';
            // Show detail images for the selected section
            showDetail(section);
          }
        });
      });

      // Click on empty area inside the stack → deselect
      stack.addEventListener('click', function(e) {
        deselect();
      });

      // Click outside the stack → deselect
      document.addEventListener('click', function(e) {
        if (!stack.contains(e.target)) {
          deselect();
        }
      });

      // Deep-link from Library: preselect the image named by #image=N
      if (location.hash.indexOf('#image=') === 0) {
        var idx = parseInt(location.hash.slice(7), 10);
        var target = stack.querySelector('.stack-card[data-index="' + idx + '"]');
        if (target) target.click();
      }
    })();
  </script>

  <script src="js/zoom.js"></script>
</body>
</html>
